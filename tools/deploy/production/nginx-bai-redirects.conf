# Included by nginx-prod.conf (setup-prod-host.sh installs it as /etc/nginx/miu-bai-redirects.conf).
# The public lesson pages used to live at /bai/<slug>/, one per lesson a quest played; they are now one page per
# topic (/hoc/<subject>/<topic>/) and one per subject (/hoc/<subject>/). Each former address answers 301 with the
# page of the topic its quest teaches, so links already shared and search results keep working. The table was
# written once from the former pages; it never grows: a new page has its /hoc/ address only.
# Keys are regular expressions (each takes the address with or without its trailing slash): long exact keys would
# need a bigger map_hash_bucket_size, an http-wide setting of a host other sites share.
# nginx-prod.test.ts checks every target is a page the build writes.
map $uri $miu_bai_redirect {
    default "";
    ~^/bai/toan-2/?$                                                                     /hoc/toan/;
    ~^/bai/tieng-viet-2/?$                                                               /hoc/tieng-viet/;
