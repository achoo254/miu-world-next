# Continuous deploy of miu.hoandat.com: after `ci` passes on a push to main, check the release gate and build the
# release (tools/deploy/production/build-release.sh, the same build as `deploy.sh release`) in a job without any
# secret, then upload it as the restricted `miu-deploy` user to /opt/miu/incoming/<id> and activate it through the one
# sudo command that user has (tools/deploy/production/activate-incoming.sh): database backup, switch, restart (the
# server migrates as it starts), health and site check, previous release restored on failure. Unit, nginx and env
# change only through `deploy.sh setup`; the app's secrets stay in the env file on the host.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy halfway; later runs wait their turn.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The release gate asks the CI runs of the commit (gh run list).
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release gate
        env:
          GH_TOKEN: ${{ github.token }}
          MIU_GH_REPO: ${{ github.repository }}
        run: tools/deploy/production/deploy.sh gate
      - id: release
        name: Build release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "id=$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}" >>"$GITHUB_OUTPUT"
          mkdir release
          bash tools/deploy/production/build-release.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      # The server address and SSH port are secrets so the public repository does not show them.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      TARGET: miu-deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/miu_deploy
          chmod 600 ~/.ssh/miu_deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          printf 'Host %s\n  Port %s\n  IdentityFile ~/.ssh/miu_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_PORT" >~/.ssh/config
      - name: Upload and activate
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{12}$ ]] || { echo "bad release id '$RELEASE_ID'" >&2; exit 1; }
          rsync -rltz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r release/ "$TARGET:/opt/miu/incoming/$RELEASE_ID/"
          # shellcheck disable=SC2029  # the checked release id is meant to expand on this side
          ssh "$TARGET" "sudo -n /usr/local/sbin/miu-activate-incoming $RELEASE_ID"
      - name: Smoke from outside
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://miu.hoandat.com/)"
          [ "$code" = 200 ] || { echo "https://miu.hoandat.com/ -> $code" >&2; exit 1; }
          curl -fsS --max-time 15 https://miu.hoandat.com/api/health | grep -q '"status":"ok"' \
            || { echo "https://miu.hoandat.com/api/health is not ok" >&2; exit 1; }
          served="$(curl -fsS --max-time 15 "https://miu.hoandat.com/RELEASE?v=$RELEASE_ID" | tr -d '\r\n')"
          [ "$served" = "$RELEASE_ID" ] || { echo "site serves release '$served', expected $RELEASE_ID" >&2; exit 1; }
          echo "miu.hoandat.com serves $RELEASE_ID"
      - if: always()
        run: rm -f ~/.ssh/miu_deploy
